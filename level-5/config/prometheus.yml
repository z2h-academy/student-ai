global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # La API librarian (Level 2) corriendo en el compose (perfil l5)
  - job_name: 'librarian-api'
    static_configs:
      - targets: ['librarian-api:8000']
