services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helmet-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    container_name: helmet-postgres
    environment:
      POSTGRES_DB: helmet
      POSTGRES_USER: helmet
      POSTGRES_PASSWORD: changeme1234
    ports:
      - "5433:5432"
    volumes:
      - helmet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmet -d helmet"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  helmet_pgdata:
