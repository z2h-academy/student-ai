apiVersion: v1
kind: Service
metadata:
  name: mission-control-api
  namespace: ai-platform
  labels:
    app: mission-control-api
    tier: api
spec:
  type: LoadBalancer
  selector:
    app: mission-control-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  sessionAffinity: None
